<nav
  aria-label="Primary navigation"
  class="flex h-screen w-64 shrink-0 flex-col justify-between bg-sage-100 py-8 text-sage-900"
>
  <div class="px-2">
    <div class="mb-12 flex items-center gap-3 px-">
      <span class="text-lg font-semibold tracking-tight text-sage-950">study app</span>
    </div>

    <app-navigation-section headingId="workspace-navigation">

      @for (item of workspaceItems; track item.label) {
        <app-navigation-item
          [active]="item.active ?? false"
          [item]="item"
        />
      }
    </app-navigation-section>
    <app-navigation-section [label]="semesterLabel()" headingId="semester-navigation">
      @for (item of semesterItems(); track item.label) {
        <app-navigation-item
          [active]="item.active ?? false"
          [item]="item" />
      }

      <div class="mt-2 pt-4">
        <app-navigation-item
          [item]="newModuleItem" />
      </div>
    </app-navigation-section>
  </div>

  <div class="space-y-1 px-5">
    @for (item of accountItems(); track item.label) {
      <app-navigation-item
        [active]="item.active ?? false"
        [item]="item" />
    }
  </div>
</nav>
