@if (module(); as module) {
  <div class="flex h-full flex-col">
    <header class="shrink-0 bg-sage-50 px-16 pt-16 text-sage-950">
      <div class="mb-10 flex items-end justify-between">
        <div>
          <h1 class="mb-2 text-5xl font-black tracking-tighter text-sage-950">
            {{ module.name }}
          </h1>
          <p class="flex items-center gap-3 text-lg font-medium text-sage-600">
            {{ semesterLabel() }}
            <span class="h-1.5 w-1.5 rounded-full bg-sage-400"></span>
            <span class="text-sage-800">{{ timeUntilExamLabel() }}</span>
          </p>
        </div>
        <button
          class="rounded-full bg-sage-900 px-6 py-3.5 text-base font-bold text-white shadow-[0_0_20px_rgba(159,168,139,0.2)] transition-all hover:scale-105 hover:bg-sage-800"
        >
          Start Practice Session
        </button>
      </div>
    </header>

    <z-tab-group
      zVariant="line"
      [zActiveTabIndex]="activeTabIndex()"
      (zTabChange)="selectTab($event.index)"
      class="min-h-0 flex-1 gap-0"
      zNavClass="group-data-[orientation=horizontal]/tabs:h-auto w-full shrink-0 justify-start gap-8 rounded-none border-b border-sage-200 bg-sage-50 p-0 px-16 text-sage-500"
      zTabClass="h-auto flex-none rounded-none border-0 border-b-2 border-transparent px-0 pt-0 pb-4 text-sm font-bold text-sage-500 after:hidden hover:text-sage-950 data-active:border-sage-950 data-active:text-sage-950"
      zContentClass="min-h-0 overflow-auto bg-white mx-auto w-full max-w-6xl p-16"
    >
      <z-tab label="Overview">
        <app-overview-tab />
      </z-tab>
      <z-tab label="Sources">
        <app-source-tab [moduleId]="module.id" />
      </z-tab>
      <z-tab label="Practice">practice tab content</z-tab>
      <z-tab label="Exam Prep">exam prep tab content</z-tab>
    </z-tab-group>
  </div>
}
