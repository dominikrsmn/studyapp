@if (module(); as module) {
  <div class="flex h-full flex-col">
    <header
      class="module-header"
      [class.module-header--compact]="isHeaderCompact()"
    >
      <div class="module-header__inner">
        <div class="min-w-0">
          <h1 class="module-header__title">
            {{ module.name }}
          </h1>
          <p
            class="module-header__metadata"
            [attr.aria-hidden]="isHeaderCompact()"
          >
            {{ semesterLabel() }}
            <span class="h-1.5 w-1.5 rounded-full bg-sage-400"></span>
            <span class="text-sage-800">{{ timeUntilExamLabel() }}</span>
          </p>
        </div>
        <p
          class="module-header__compact-exam"
          [attr.aria-hidden]="!isHeaderCompact()"
        >
          {{ timeUntilExamLabel() }}
        </p>
        <button class="module-header__action">Start Practice Session</button>
      </div>
    </header>

    <z-tab-group
      #moduleTabs
      zVariant="line"
      [zActiveTabIndex]="activeTabIndex()"
      (zTabChange)="selectTab($event.index)"
      (zContentScroll)="handleContentScroll($event)"
      class="min-h-0 flex-1 gap-0 overflow-hidden"
      [zNavClass]="moduleTabNavClass()"
      zTabClass="h-auto flex-none rounded-none border-0 border-b-2 border-transparent px-0 pt-0 pb-4 text-sm font-bold text-sage-500 after:hidden hover:text-sage-950 data-active:border-sage-950 data-active:text-sage-950"
      zContentClass="min-h-0 w-full flex-1 overflow-y-auto overscroll-contain bg-white p-16"
    >
      <z-tab label="Overview">
        <div class="mx-auto w-full max-w-6xl">
          <app-overview-tab />
        </div>
      </z-tab>
      <z-tab label="Sources">
        <div class="mx-auto w-full max-w-6xl">
          <app-source-tab [moduleId]="module.id" />
        </div>
      </z-tab>
      <z-tab label="Practice">
        <div class="mx-auto w-full max-w-6xl">practice tab content</div>
      </z-tab>
      <z-tab label="Exam Prep">
        <div class="mx-auto w-full max-w-6xl">exam prep tab content</div>
      </z-tab>
    </z-tab-group>
  </div>
}
