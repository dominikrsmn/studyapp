<section
  aria-label="Learning graph"
  class="min-h-96 overflow-auto rounded-xl border border-border bg-background"
>
  @if (loading()) {
    <p role="status" class="p-12 text-center text-muted-foreground">
      Loading learning graph…
    </p>
  } @else if (error()) {
    <p role="alert" class="p-12 text-center text-muted-foreground">
      Could not load the learning graph. Please try again.
    </p>
  } @else if (!graph()) {
    <p class="p-12 text-center text-muted-foreground">
      No learning graph has been published yet.
    </p>
  } @else if (!graph()!.topics.length) {
    <p class="p-12 text-center text-muted-foreground">
      No topics were found in your sources.
    </p>
  } @else {
    <svg
      [attr.width]="diagram().width"
      [attr.height]="diagram().height"
      role="group"
      aria-label="Topics and prerequisite relationships"
    >
      <defs>
        <pattern
          [attr.id]="'graph-dots-' + moduleId()"
          width="20"
          height="20"
          patternUnits="userSpaceOnUse"
        >
          <circle cx="1" cy="1" r="1" class="fill-border" />
        </pattern>
        <marker
          [attr.id]="'graph-arrow-' + moduleId()"
          viewBox="0 0 10 10"
          refX="9"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path d="M 0 0 L 10 5 L 0 10 z" class="fill-muted-foreground" />
        </marker>
      </defs>
      <rect
        width="100%"
        height="100%"
        [attr.fill]="'url(#graph-dots-' + moduleId() + ')'"
      />
      @for (edge of diagram().edges; track edge.id) {
        <path
          [attr.d]="edge.path"
          fill="none"
          class="stroke-muted-foreground"
          stroke-width="1.5"
          [attr.marker-end]="'url(#graph-arrow-' + moduleId() + ')'"
          role="img"
          [attr.aria-label]="edge.label"
        >
          <title>{{ edge.label }}</title>
        </path>
      }
      @if (diagram().isolatedNodes.length) {
        <text
          x="24"
          [attr.y]="diagram().isolatedY - 20"
          class="fill-muted-foreground text-sm"
        >
          Isolated topics
        </text>
      }
      @for (
        topic of diagram().nodes.concat(diagram().isolatedNodes);
        track topic.id
      ) {
        <foreignObject
          [attr.x]="topic.x"
          [attr.y]="topic.y"
          [attr.width]="nodeWidth"
          [attr.height]="nodeHeight"
        >
          <article
            class="h-full rounded-xl border border-border bg-card p-4 text-card-foreground"
          >
            <h2 class="line-clamp-2 text-sm font-semibold">
              {{ topic.title }}
            </h2>
            <p class="mt-2 line-clamp-3 text-xs text-muted-foreground">
              {{ topic.description }}
            </p>
          </article>
        </foreignObject>
      }
    </svg>
  }
</section>
