<button
  #iconPopoverTrigger
  type="button"
  z-button
  zType="outline"
  zPopover
  [zContent]="iconPickerContent"
  aria-label="Choose icon"
  class="size-9 shrink-0 p-0"
>
  <span
    [appIcon]="value()"
    class="text-lg"
  ></span>
</button>

<ng-template #iconPickerContent>
  <z-popover class="w-80 p-0">
    <!-- Header -->
    <div class="border-b p-3">
      <div class="mb-3">
        <p class="text-sm font-medium">
          Icon
        </p>

        <p class="text-muted-foreground text-xs">
          Choose an icon for this module.
        </p>
      </div>

      <div class="flex gap-2">
        <input
          z-input
          type="search"
          placeholder="Filter icons..."
          class="flex-1"
          [value]="search()"
          (input)="onSearch($event)"
        />

        <button
          type="button"
          z-button
          zType="outline"
          class="size-9 shrink-0 p-0"
          aria-label="Choose random icon"
          title="Random icon"
          (click)="selectRandomIcon()"
        >
          <span
            appIcon="shuffle"
            class="text-sm"
          ></span>
        </button>
      </div>
    </div>

    <!-- All icons -->
    <div class="p-3">
      <p
        class="text-muted-foreground mb-2 text-[11px] font-medium uppercase tracking-wide"
      >
        @if (search()) {
          Results
        } @else {
          Icons
        }
      </p>

      <div class="max-h-64 overflow-y-auto pr-1">
        @if (filteredIcons().length > 0) {
          <div class="grid grid-cols-7 gap-1">
            @for (icon of filteredIcons(); track icon) {
              <button
                type="button"
                z-button
                zType="ghost"
                class="relative size-9 p-0"
                [title]="icon"
                [attr.aria-label]="icon"
                (click)="selectIcon(icon)"
              >
                <span
                  [appIcon]="icon"
                  class="text-base"
                ></span>

                @if (value() === icon) {
                  <span
                    class="border-primary absolute inset-0 rounded-md border"
                  ></span>
                }
              </button>
            }
          </div>
        } @else {
          <div
            class="text-muted-foreground py-8 text-center text-sm"
          >
            No icons found.
          </div>
        }
      </div>
    </div>
  </z-popover>
</ng-template>
